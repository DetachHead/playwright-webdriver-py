[project]
name = "playwright-webdriver-py"
version = "0.1.0"
description = "Run existing Selenium WebDriver Python scripts using Playwright as the browser backend — no ChromeDriver required."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
    { name = "HappyPath", email = "hello@happypath.io" },
]
keywords = ["selenium", "playwright", "webdriver", "browser", "automation", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.47.0",
    "selenium>=4.41.0",
]

[project.urls]
Homepage = "https://github.com/happypath-team/playwright-webdriver-py"
Repository = "https://github.com/happypath-team/playwright-webdriver-py"
Issues = "https://github.com/happypath-team/playwright-webdriver-py/issues"
Changelog = "https://github.com/happypath-team/playwright-webdriver-py/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playwright_webdriver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
