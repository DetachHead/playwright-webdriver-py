name: check

on: pull_request

jobs:
  test:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./pw uv run playwright install --with-deps chromium-headless-shell
      - run: ./pw test
  static_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: ./pw uv sync --locked

      - run: ./pw uv run pyrefly check --error-stale-baseline

      - name: ruff check
        if: always()
        run: ./pw uv run ruff check --output-format github

      - name: ruff format
        if: always()
        run: ./pw uv run ruff format --check --diff

      - run: ./pw dprint
        if: always()

      - run: ./pw uv run rumdl check --deny-config-warnings
        if: always()

      - run: ./pw uv run zensical build --strict
        if: always()
